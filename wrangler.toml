name = "ai-ocr-sample1"
main = "./src/worker/index.ts"
# 開発サーバーのworkerdが対応する最新日付。
# `@cloudflare/vite-plugin` は workerd / miniflare を自身の dependencies に固定するため、
# ルートの wrangler を上げてもこの下限は動かない。プラグインを上げるまでこの日付を超えられない。
# 依存更新時は `@cloudflare/vite-plugin` の workerd バージョンを見て見直す。
compatibility_date = "2026-08-18"

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
invocation_logs = true

[assets]
binding = "ASSETS"
directory = "./dist/client"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ai-ocr-sample1"
# D1作成後に実際のIDへ置き換える。ゼロUUIDはローカル開発専用の仮値。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-ocr-sample1-images"
